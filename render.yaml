services:
  - type: web
    name: gestion-talleres-backend
    runtime: node
    # Migraciones en build (seguro), arranque limpio sin prisma
    buildCommand: cd backend && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd backend && node dist/main
    envVars:
      # ⚠️ Configurar estos valores manualmente en el Dashboard de Render
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PORT
        value: "3000"
      - key: FRONTEND_ORIGIN
        sync: false
